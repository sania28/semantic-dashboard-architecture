<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Accessible Modal</title>
</head>
<body>

<dialog id="account-dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title">Account Settings</h2>

    <p>
        Manage your account preferences and notification settings.
    </p>

    <form method="dialog">
        <button type="submit">Close</button>
    </form>
</dialog>

</body>
</html>
